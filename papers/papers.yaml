# Source of truth for the papers the project builds on.
#
# - Titles were checked against the arXiv API on 2026-10-23 (all ids matched their expected
#   titles). `version` pins the PDF the reading notes in README.md refer to: page and table
#   numbers depend on it.
# - `year` is the year of the first arXiv version. `venue` comes from the arXiv comment field
#   or the PDF itself; `TODO(verify)` means neither states it.
# - The PDF is saved as papers/pdf/<year>_<acronym>_<short_title>.pdf by download_papers.py.
# - `group`: main / complementary (from the brief), task1 (added for classification, D9).

