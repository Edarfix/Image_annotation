[project]
name = "ovannot"
version = "0.1.0"
description = "Testbed for comparing automatic image-annotation pipelines (classification and open-vocabulary detection) on out-of-distribution datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pypdf>=4.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovannot"]

[tool.uv]
# Laptops and the cluster login node are x86_64, the cluster compute nodes are aarch64:
# keep the lock universal across Linux architectures only.
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ovannot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not gpu and not network'"
markers = [
    "gpu: needs a GPU or running model servers (cluster only)",
    "network: needs internet access",
]
